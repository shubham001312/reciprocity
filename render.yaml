services:
  - type: web
    name: reciprocity
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && cd client && npm install --include=dev && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_VERSION
        value: "22.12.0"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
