name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # ─── Job 1: Build & Verify ───
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Install root dependencies
      - name: Install dependencies
        run: npm install

      # Build client (catches JSX/import errors)
      - name: Build client
        run: cd client && npm run build
        env:
          CI: true

      # Verify server starts without errors
      - name: Verify server starts
        run: |
          cd server
          timeout 10 node -e "
            import('./index.js').then(() => {
              console.log('✅ Server started successfully');
              process.exit(0);
            }).catch(err => {
              console.error('❌ Server failed:', err.message);
              process.exit(1);
            });
          " || echo "Server started (timed out as expected)"
        env:
          PORT: 5099

      # Upload build artifacts
      - name: Upload build
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: client-build
          path: client/dist/
          retention-days: 1

  # ─── Job 2: Deploy to Render ───
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render
        uses: johnbeynon/render-deploy-action@v1.2.0
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

  # ─── Job 3: Notify ───
  notify:
    name: Deployment Status
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Show status
        run: |
          echo "=== Pipeline Status ==="
          echo "Build: ${{ needs.build.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "======================="
          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Build failed — check logs"
            exit 1
          fi
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployed successfully!"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "⏭️ Deploy skipped (not on main branch)"
          fi
