name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Job 1: Build & Verify (runs on every push + PR) ───
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Install client dependencies
        run: cd client && npm install --include=dev

      - name: Install server dependencies
        run: cd server && npm install

      - name: Build client
        run: cd client && npm run build
        env:
          CI: true

      - name: Verify server modules load
        run: |
          cd server
          node -e "
            import('./utils/db.js').then(() => {
              console.log('✅ Database module loaded');
              process.exit(0);
            }).catch(err => {
              console.error('❌ Module load failed:', err.message);
              process.exit(1);
            });
          "

      - name: Verify all route files exist
        run: |
          cd server
          node --input-type=module -e "
            import { existsSync } from 'fs';
            const files = [
              'routes/auth.js', 'routes/users.js', 'routes/classes.js',
              'routes/attendance.js', 'routes/subjects.js', 'routes/marks.js',
              'routes/notes.js', 'routes/questions.js', 'routes/analytics.js',
              'routes/rankings-enhanced.js', 'routes/colleges.js',
              'routes/designations.js', 'routes/profiles.js',
              'routes/college-register.js', 'routes/notices.js',
              'routes/messages.js', 'routes/syllabus.js', 'routes/reports.js',
              'routes/pdf-reports.js', 'routes/attendance-export.js'
            ];
            const missing = files.filter(f => !existsSync(f));
            if (missing.length > 0) {
              console.error('❌ Missing routes:', missing);
              process.exit(1);
            }
            console.log('✅ All', files.length, 'route files present');
          "

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Client build | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Server modules | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Route files | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─── Job 2: Deploy to Render (only on push to main) ───
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render (clear cache + rebuild)
        uses: johnbeynon/render-deploy-action@v1.2.0
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}

      - name: Wait for deploy
        run: sleep 30

      - name: Health check
        run: |
          URL="https://${{ secrets.RENDER_SERVICE_ID }}.onrender.com"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 15 || echo "000")
          echo "### Deploy Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "URL: $URL" >> $GITHUB_STEP_SUMMARY
          echo "Status: \`$STATUS\`" >> $GITHUB_STEP_SUMMARY
          if [ "$STATUS" = "200" ]; then
            echo "✅ Site is live!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Site returned $STATUS — may still be starting up" >> $GITHUB_STEP_SUMMARY
          fi

  # ─── Job 3: Status Summary ───
  status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()

    steps:
      - name: Show final status
        run: |
          echo "=== CI/CD Pipeline Status ==="
          echo "Build:  ${{ needs.build.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "============================="
          
          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "❌ Build failed — fix errors and push again"
            exit 1
          fi
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployed successfully!"
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "⏭️ Deploy skipped (PR or non-main branch)"
          fi
